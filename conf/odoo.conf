[options]
addons_path = /mnt/custom-addons, /usr/lib/python3/dist-packages/odoo/addons
admin_passwd = admin_passwd
csv_internal_sep = ,
data_dir = /var/lib/odoo
db_host = mydb
# Database connection pooling - reduced from 64 for smaller setup
db_maxconn = 32
# Memory management - using new parameter names
# Reduced from 500
osv_memory_count_limit = 200
# Reduced from 0.5
transient_age_limit = 0.25
db_name = postgres
db_user = odoo
db_password = odoo
db_port = 5432
db_sslmode = prefer
db_template = template0
db_filter =
debug_mode = False
demo = {}
email_from = False
geoip_database = /usr/share/GeoIP/GeoLite2-City.mmdb
http_enable = True
http_interface =
http_port = 8069
# Worker configuration for better CPU utilization
# Disable Workers for Development (Recommended)
# workers = 4
workers = 0
max_cron_threads = 1
# Memory limits - adjusted for 2GB total system memory
# 1GB hard limit
limit_memory_hard = 1073741824
# 768MB soft limit
limit_memory_soft = 805306368
# Request limits - reduced from 8192
limit_request = 4096
# Increased timeouts for heavy operations
limit_time_cpu = 300
limit_time_real = 600
list_db = True
# Log optimization for production - changed from info to reduce I/O
log_level = info
log_handler = [':INFO']
# Keep disabled for performance
log_db = False
logfile = None
longpolling_port = 8072
smtp_password = False
smtp_port = 25
smtp_server = localhost
smtp_ssl = False
smtp_user = False
xmlrpc = True
xmlrpc_port = 8069
xmlrpcs = True
xmlrpcs_port = 8071
dbfilter = .*

# Session persistence configuration
session_dir = /var/lib/odoo/sessions
server_wide_modules = base,web
# Enhanced caching
enable_caching = True